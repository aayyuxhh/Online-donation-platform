<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Willingness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">willingness<span>.</span> <span style="font-size:14px; color:#555;">(Admin)</span></a>
    <div class="nav-links">
      <span id="adminWelcomeUser" style="font-weight:600;"></span>
      <button class="btn-primary" style="background: #333;" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <div class="admin-container">
    <h2>Admin Dashboard - Donation Records & Campaign Manager</h2>
    
    <!-- Metrics Cards -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 20px 0;">
      <div class="card-box" style="text-align:center;">
        <h3>Total Funds Raised</h3>
        <p id="totalFundsMetric" style="font-size: 32px; font-weight:bold; color:var(--primary); margin-top:10px;">₹0</p>
      </div>
      <div class="card-box" style="text-align:center;">
        <h3>Total Donors Registered</h3>
        <p id="totalDonorsMetric" style="font-size: 32px; font-weight:bold; color:#2e7d32; margin-top:10px;">0</p>
      </div>
    </div>

    <!-- Create New Campaign Section -->
    <div class="card-box" style="margin-top: 30px;">
      <h3 style="margin-bottom: 15px; color: #b45309;">➕ Create New Campaign for Home Screen</h3>
      <form id="campaignForm" onsubmit="handleCreateCampaign(event)">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label>Campaign Title *</label>
            <input type="text" id="campTitle" placeholder="e.g. Winter Blanket Distribution Drive">
          </div>
          <div class="form-group">
            <label>Target Amount (₹) *</label>
            <input type="number" id="campAmount" placeholder="e.g. 500">
          </div>
        </div>
        <div class="form-group">
          <label>Campaign Description *</label>
          <input type="text" id="campDesc" placeholder="e.g. Provide warm woolen blankets to homeless families.">
        </div>
        <div class="form-group">
          <label>Image URL (Unsplash Link)</label>
          <input type="text" id="campImage" placeholder="https://images.unsplash.com/...">
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Publish Campaign to Home</button>
      </form>
    </div>

    <h3 style="margin-top: 40px;">Recent Donations Log</h3>
    <table>
      <thead>
        <tr>
          <th>Transaction ID</th>
          <th>Donor Name</th>
          <th>Cause</th>
          <th>Amount</th>
          <th>Payment Mode</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="adminDonationTableBody">
        <!-- Populated via script.js -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
